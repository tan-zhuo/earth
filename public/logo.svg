<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globe" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2e5d92"/>
      <stop offset="55%" stop-color="#17324f"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="19"/>
    </clipPath>
  </defs>

  <!-- 轨道环（背面一半，穿过地球后方） -->
  <g transform="rotate(-24 32 32)">
    <path d="M 4.5 32 A 27.5 10.5 0 0 1 59.5 32" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.6"/>
  </g>

  <!-- 地球 -->
  <circle cx="32" cy="32" r="19" fill="url(#globe)"/>
  <g clip-path="url(#clip)" stroke="#38bdf8" fill="none">
    <!-- 纬线 -->
    <ellipse cx="32" cy="23" rx="16.5" ry="3.6" stroke-opacity="0.45" stroke-width="1"/>
    <ellipse cx="32" cy="32" rx="19" ry="4.6" stroke-opacity="0.6" stroke-width="1.1"/>
    <ellipse cx="32" cy="41" rx="16.5" ry="3.6" stroke-opacity="0.45" stroke-width="1"/>
    <!-- 经线 -->
    <ellipse cx="32" cy="32" rx="6.5" ry="19" stroke-opacity="0.5" stroke-width="1"/>
    <ellipse cx="32" cy="32" rx="13.5" ry="19" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="32" y1="13" x2="32" y2="51" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- 轨道环（正面一半）+ 卫星 -->
  <g transform="rotate(-24 32 32)">
    <path d="M 4.5 32 A 27.5 10.5 0 0 0 59.5 32" fill="none" stroke="url(#ring)" stroke-width="1.8"/>
    <circle cx="59.5" cy="32" r="3" fill="#fbbf24"/>
    <circle cx="59.5" cy="32" r="5" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- 星点 -->
  <circle cx="12" cy="12" r="1.3" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="53" cy="9" r="0.9" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="9" cy="47" r="0.8" fill="#e0f2fe" opacity="0.6"/>
</svg>
